let lang = "en";
function setLang(l){
  lang = T[l] ? l : "en";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v = T[lang][el.dataset.i18n];
    if(v !== undefined) el.innerHTML = v;
  });
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
  const f = document.querySelector(".yt-facade"); if(f) f.setAttribute("aria-label", T[lang].play);
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  setLang(b.dataset.lang);
  try{ history.replaceState(null, "", "#"+lang); }catch(e){}
}));

// basın maili
if(PRESS_EMAIL){
  document.querySelectorAll(".press-mail").forEach(el=>el.textContent = PRESS_EMAIL);
  document.querySelectorAll(".press-row").forEach(el=>el.hidden = false);
}else{
  document.getElementById("studioRow").classList.add("solo");
}
document.getElementById("copyMail").addEventListener("click", e=>{
  const btn = e.currentTarget;
  const done = ()=>{ btn.textContent = T[lang].copied; setTimeout(()=>btn.textContent = T[lang].copy, 1600); };
  try{ navigator.clipboard.writeText(PRESS_EMAIL).then(done).catch(selectMail); }catch(err){ selectMail(); }
});
function selectMail(){
  const el = document.querySelector(".contact-mail"); const r = document.createRange();
  r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

// fragman: tıklayınca YouTube oynatıcısı yüklenir
const video = document.getElementById("video");
let curTrailer = "EN";
function showFacade(code){
  video.innerHTML = "";
  const b = document.createElement("button");
  b.type = "button"; b.className = "yt-facade"; b.setAttribute("aria-label", T[lang].play);
  const img = document.createElement("img"); img.src = "img/poster_"+code+".jpg"; img.alt = "";
  const p = document.createElement("span"); p.className = "play"; p.setAttribute("aria-hidden","true");
  b.append(img, p);
  b.addEventListener("click", ()=>{
    const f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/"+YOUTUBE[code]+"?autoplay=1&rel=0";
    f.title = "Nothing to Report trailer";
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.allowFullscreen = true;
    video.innerHTML = ""; video.appendChild(f);
  });
  video.appendChild(b);
}
function setTrailer(code){
  curTrailer = code;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", String(t.dataset.trailer===code)));
  showFacade(code);
  document.getElementById("ytLink").href = "https://youtu.be/"+YOUTUBE[code];
  document.getElementById("mp4Link").href = "trailer/NothingToReport_Trailer_"+code+"_720p.mp4";
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setTrailer(t.dataset.trailer)));

// ekran görüntüleri + büyütme
const grid = document.getElementById("shots");
SHOTS.forEach((n,i)=>{
  const b = document.createElement("button");
  b.className = "shot"; b.type = "button"; b.setAttribute("aria-label","Screenshot "+(i+1));
  const img = document.createElement("img"); img.loading = "lazy"; img.alt = ""; img.src = "shots/thumb/"+n+".jpg";
  img.width = 800; img.height = 450;
  b.appendChild(img); b.addEventListener("click",()=>openLb(i)); grid.appendChild(b);
});
const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg"), lbFull = document.getElementById("lbFull");
let cur = 0, lastFocus = null;
function showLb(i){ cur = (i+SHOTS.length)%SHOTS.length; const f = "shots/full/"+SHOTS[cur]+".jpg"; lbImg.src = f; lbFull.href = f; }
function openLb(i){ lastFocus = document.activeElement; showLb(i); lb.classList.add("open"); document.getElementById("lbClose").focus(); }
function closeLb(){ lb.classList.remove("open"); lbImg.removeAttribute("src"); if(lastFocus) lastFocus.focus(); }
document.getElementById("lbClose").onclick = closeLb;
document.getElementById("lbPrev").onclick = ()=>showLb(cur-1);
document.getElementById("lbNext").onclick = ()=>showLb(cur+1);
lb.addEventListener("click",e=>{ if(e.target===lb) closeLb(); });
document.addEventListener("keydown",e=>{
  if(!lb.classList.contains("open")) return;
  if(e.key==="Escape") closeLb(); if(e.key==="ArrowLeft") showLb(cur-1); if(e.key==="ArrowRight") showLb(cur+1);
});

// ilk dil: varsayılan İngilizce; #tr, #ja ya da ?lang=tr ile başka dil açılır
(function(){
  const h = (location.hash||"").replace("#","").toLowerCase();
  const q = (new URLSearchParams(location.search).get("lang")||"").toLowerCase();
  setLang(T[h] ? h : T[q] ? q : "en");
  setTrailer("EN");
})();
</script>
